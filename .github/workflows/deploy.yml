name: Deploy

# Deploys ONLY on a version tag (owner, 2026-09-25: no deploy on pushes to main),
# the same v*.*.* tag that builds the desktop app (release.yml):
#   git tag v1.2.3 && git push origin v1.2.3
# or by hand from the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Vector files copied from madar-shared must be the bytes at the tag
      # they name (src/lib/*.source.json).
      - name: Shared vectors match madar-shared
        run: scripts/check-shared-vectors.sh

      - name: Build dashboard
        run: npm run build
        env:
          # Dashboard talks to the dedicated API origin (cross-origin; CORS allows it).
          # The main madar-pos.cloud vhost no longer proxies /api.
          VITE_API_URL: https://api.madar-pos.cloud
          # Self-hosted Sentry. The DSN is a public value (safe in the clear);
          # session replay is recorded with all text/inputs masked and media
          # blocked — see src/lib/sentry.ts.
          VITE_SENTRY_DSN: https://f4aeabcb758c4cd1d1d12d5f5ee2a46c@sentry.madar-pos.cloud/2
          VITE_SENTRY_ENVIRONMENT: production
          # Source-map upload. Only runs when all three are present; add
          # SENTRY_AUTH_TOKEN (org token with project:releases + project:write)
          # as a repository secret, otherwise the build simply skips the upload
          # and ships no source maps.
          SENTRY_URL: https://sentry.madar-pos.cloud
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build ordering app (separate, isolated bundle)
        run: npm run build:order
        env:
          VITE_API_URL: https://order.madar-pos.cloud/api

      - name: Build ordering app for a shop's own hostname
        run: npm run build:order:shop
        env:
          # Relative, and it has to be: this artifact is served from EVERY shop's
          # hostname, so there is no one origin to name. The shop vhost proxies
          # /api/ to the backend exactly as the loyalty host does.
          VITE_API_URL: /api

      - name: Build reservations app for a shop's own hostname
        run: npm run build:reservations:shop
        env:
          VITE_API_URL: /api

      - name: Build reservations app (separate, isolated bundle)
        run: npm run build:reservations
        env:
          VITE_API_URL: https://reservations.madar-pos.cloud/api

      - name: Build loyalty app (separate, isolated bundle)
        run: npm run build:loyalty
        env:
          # RELATIVE, because this one artifact is served from TWO kinds of
          # host: `loyalty.madar-pos.cloud`, and the root of every branded
          # shop's own hostname, where it is the loyalty card mount. Both proxy
          # `/api/` to the backend.
          #
          # It used to name `https://loyalty.madar-pos.cloud/api` absolutely,
          # which is same-origin on the shared host and CROSS-origin on every
          # shop host — where `CORS_ALLOWED_ORIGINS` is an explicit list with no
          # wildcard, so the browser blocked it. Relative is same-origin on
          # both, which is what the note below always claimed: the member token
          # in a card URL never crosses origins and the page needs no CORS
          # grant.
          VITE_API_URL: /api

      - name: Build demo dashboard (VITE_DEMO — talks to the isolated demo API)
        run: npm run build:demo
        env:
          VITE_API_URL: https://demo-api.madar-pos.cloud

      # The marketing site (get.madar-pos.cloud) is its own Astro package in site/,
      # with its own lockfile, and Astro 6 needs Node 22. The dashboard builds above
      # stay on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build marketing site (site/, Astro)
        run: |
          npm ci --prefix site
          npm run build --prefix site
        env:
          # Cookieless Umami analytics: on once this repository variable is set.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          ASTRO_TELEMETRY_DISABLED: 1

      # Every SPA host below is deployed with rsync over SSH: it uploads what
      # changed and DELETES what the build no longer has (old landing files,
      # macOS ._ files), so a web root holds exactly one build. Hashed files in
      # /assets/ are protected from deletion (`P /assets/***`): a tab still
      # running the previous index.html can go on loading its chunks. Nothing
      # else lives in these roots (the brochure is in /var/www/madar-downloads,
      # uploads in /opt/madar-rust/uploads). The key is written once here and
      # removed by the last step.
      - name: Set up the SSH key for rsync
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy dashboard to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist/ "$VPS_USER@$VPS_HOST:/var/www/madar-dashboard/"

      - name: Deploy ordering app to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist-order/ "$VPS_USER@$VPS_HOST:/var/www/madar-order/"

      - name: Deploy shop ordering bundle to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist-order-shop/ "$VPS_USER@$VPS_HOST:/var/www/madar-order-shop/"

      - name: Deploy shop reservations bundle to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist-reservations-shop/ "$VPS_USER@$VPS_HOST:/var/www/madar-reservations-shop/"

      # rsync --delete, so files the site no longer builds don't linger on the server
      # (old landing leftovers, removed pages). Hashed files in assets/ are protected
      # from the delete: Cloudflare keeps get's HTML for up to 5 minutes, and those
      # cached pages still point at the previous build's assets. Old assets can be
      # pruned by age now and then. --checksum sends only changed files, so unchanged
      # pages keep their Last-Modified.
      - name: Deploy marketing site to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          site/dist/ "$VPS_USER@$VPS_HOST:/var/www/madar-get/"

      - name: Ensure reservations web root exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo mkdir -p /var/www/madar-reservations && sudo chown -R $USER /var/www/madar-reservations

      - name: Deploy reservations app to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist-reservations/ "$VPS_USER@$VPS_HOST:/var/www/madar-reservations/"

      - name: Ensure loyalty web root exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo mkdir -p /var/www/madar-loyalty && sudo chown -R $USER /var/www/madar-loyalty

      - name: Deploy loyalty app to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        # Matches the nginx root in MadarRust/deploy/loyalty/nginx-loyalty.conf.
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist-loyalty/ "$VPS_USER@$VPS_HOST:/var/www/madar-loyalty/"

      - name: Ensure demo web root exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo mkdir -p /var/www/madar-demo && sudo chown -R $USER /var/www/madar-demo

      - name: Deploy demo dashboard to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: >-
          rsync -rl --checksum --delete --filter='P /assets/***' --chmod=D755,F644
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          dist-demo/ "$VPS_USER@$VPS_HOST:/var/www/madar-demo/"

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: sudo systemctl reload nginx

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
