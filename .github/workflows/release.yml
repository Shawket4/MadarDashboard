name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build Desktop & Release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon Mac
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel Mac
            target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux (AppImage & deb)
            target: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest" # Windows (msi & exe)
            target: "x86_64-pc-windows-msvc"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Tauri v2 requires specific WebKit dependencies on Linux
      - name: Install Ubuntu dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install NPM dependencies
        run: npm install

      # This action automatically builds the app and attaches the
      # installers (.dmg, .app, .exe, .msi, .AppImage, .deb) to the GitHub release.
      #
      # macOS signing: APPLE_SIGNING_IDENTITY="-" produces an ad-hoc signature
      # so the app appears in Privacy & Security → "Open Anyway". For proper
      # distribution, replace with a Developer ID certificate + notarization:
      #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #   APPLE_ID: ${{ secrets.APPLE_ID }}
      #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Build and Upload Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Madar Dashboard ${{ github.ref_name }}"
          releaseBody: "Automated release generated by GitHub Actions."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          local-cache: false

      - name: Install NPM dependencies
        run: npm install

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > src-tauri/gen/android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > src-tauri/gen/android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri android build -- --apk

      # Creates the release if it doesn't exist yet, or appends the APK
      # if the desktop jobs already created it — safe for parallel execution.
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Madar Dashboard ${{ github.ref_name }}"
          body: "Automated release generated by GitHub Actions."
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # Mirror the finished release to https://downloads.madar-pos.cloud: rsync as the
  # restricted madar-deploy user, then rebuild its manifest. It reads the assets back from
  # the GitHub release (the desktop matrix and the APK job each add their own), so one
  # ubuntu job with rsync covers every platform. Best effort: a missing secret or an
  # unreachable box is a warning, never a failed release.
  publish-downloads:
    name: Publish to downloads.madar-pos.cloud
    if: ${{ !cancelled() && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/') }}
    needs: [build-and-release, build-android]
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOADS_SSH_KEY: ${{ secrets.DOWNLOADS_SSH_KEY }}
          DOWNLOADS_HOST: ${{ secrets.DOWNLOADS_HOST }}
          DOWNLOADS_KNOWN_HOSTS: ${{ secrets.DOWNLOADS_KNOWN_HOSTS }}
        run: |
          if [ -z "$DOWNLOADS_SSH_KEY" ] || [ -z "$DOWNLOADS_HOST" ] || [ -z "$DOWNLOADS_KNOWN_HOSTS" ]; then
            echo "::warning::DOWNLOADS_SSH_KEY / DOWNLOADS_HOST / DOWNLOADS_KNOWN_HOSTS not all set: skipping the downloads.madar-pos.cloud upload."
            exit 0
          fi
          P=dashboard-desktop; BASE=Madar-Dashboard-Desktop; V="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir artifacts || { echo "::warning::could not read the release assets"; exit 0; }
          out="$RUNNER_TEMP/dl/$P/$V"; mkdir -p "$out"
          for f in artifacts/*; do
            b=$(basename "$f")
            case "$b" in
              *.dmg) case "$b" in *aarch64*) s=macos-arm64.dmg ;; *) s=macos-x64.dmg ;; esac ;;
              *-setup.exe) s=windows-x64-setup.exe ;;
              *.msi) s=windows-x64.msi ;;
              *.AppImage) s=linux-x64.AppImage ;;
              *.deb) s=linux-x64.deb ;;
              *.rpm) s=linux-x64.rpm ;;
              *.apk) s=android.apk ;;
              *) continue ;; # updater bundles (.app.tar.gz, .sig, latest.json) stay on GitHub
            esac
            n="$BASE-$V-$s"
            cp "$f" "$out/$n"
            (cd "$out" && sha256sum "$n" > "$n.sha256")
          done
          ls -l "$out"
          install -m 600 /dev/null "$RUNNER_TEMP/dl_key"
          printf '%s\n' "$DOWNLOADS_SSH_KEY" > "$RUNNER_TEMP/dl_key"
          printf '%s\n' "$DOWNLOADS_KNOWN_HOSTS" > "$RUNNER_TEMP/dl_kh"
          SSH="ssh -i $RUNNER_TEMP/dl_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/dl_kh -o ConnectTimeout=20 -o ServerAliveInterval=30"
          # The box's gate takes only this rsync (jailed to its files/ folder) and "rebuild".
          if rsync -rt --partial -e "$SSH" "$RUNNER_TEMP/dl/" "madar-deploy@$DOWNLOADS_HOST:" \
             && $SSH "madar-deploy@$DOWNLOADS_HOST" rebuild; then
            echo "Published $P $V to https://downloads.madar-pos.cloud/"
          else
            echo "::warning::downloads.madar-pos.cloud upload failed (box unreachable?). The GitHub release is unaffected."
          fi
          rm -f "$RUNNER_TEMP/dl_key"
