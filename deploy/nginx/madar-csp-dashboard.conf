# The dashboard's (madar-pos.cloud) Content-Security-Policy, REPORT-ONLY since
# 2026-10-11: the browser blocks nothing and reports what it would have blocked
# to Sentry (project 2's security endpoint). Once Sentry shows only expected
# reports, rename the header to Content-Security-Policy to enforce it.
# Include it right after `include snippets/madar-security-headers.conf;`
# everywhere in the dashboard's vhost (a location's own add_header drops the
# server's). The dashboard calls the API and Sentry cross-origin; Sentry's
# session replay compresses in a blob: worker. Umami Cloud runs on /signup only
# (src/lib/umami.ts): script from cloud.umami.is, beacon to gateway.umami.is.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://cloud.umami.is; connect-src 'self' https://api.madar-pos.cloud https://sentry.madar-pos.cloud https://cloudflareinsights.com https://gateway.umami.is; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; report-uri https://sentry.madar-pos.cloud/api/2/security/?sentry_key=f4aeabcb758c4cd1d1d12d5f5ee2a46c" always;
