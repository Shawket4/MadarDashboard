# MIME types for the downloads vhost's artifacts (nginx's mime.types lacks aab, ipa, AppImage,
# rpm). `types` replaces the whole table inside the location that includes it.
types {
    application/vnd.android.package-archive apk;
    application/octet-stream aab ipa dmg exe msi appimage deb rpm;
    application/zip zip;
    application/gzip gz;
    text/plain sha256;
}
default_type application/octet-stream;
