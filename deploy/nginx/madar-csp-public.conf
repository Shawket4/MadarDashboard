# The Content-Security-Policy of every PUBLIC page: get, order, reservations,
# loyalty and every shop's own host (MadarRust deploy/shop/nginx-wildcard.conf).
# Include it right after `include snippets/madar-security-headers.conf;`
# EVERYWHERE that snippet is included: a location with any add_header of its
# own inherits none of the server's, so a page whose location lacks this line
# goes out with no CSP at all (order, reservations and loyalty did, until
# 2026-10-11). Change the policy here, once; get's service worker (site/sw/sw.ts)
# carries a copy for its archive pages, change both together.
#   'wasm-unsafe-eval'   the business rules (madar-shared, WebAssembly) and dotLottie
#   cloudflareinsights   Cloudflare's own analytics beacon, injected at the edge
#   umami                Umami Cloud analytics on get (script from cloud.umami.is,
#                        beacon to gateway.umami.is); site/ BaseLayout loads it
#   facebook             the Meta Pixel on get (fbevents.js from connect.facebook.net,
#                        events to www.facebook.com); shared/meta-pixel.ts
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com https://cloud.umami.is https://connect.facebook.net; connect-src 'self' https://cloudflareinsights.com https://gateway.umami.is https://www.facebook.com; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
